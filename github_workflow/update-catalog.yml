# Copy to .github/workflows/update-catalog.yml in your repo.
# Rebuilds the catalog weekly (and on demand from the Actions tab) and commits it.
name: Update catalog
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build catalog
        env:
          CATALOG_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/catalog
        run: python ambientcg_catalog.py
      - name: Commit changes
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add catalog
          git diff --staged --quiet || git commit -m "Update catalog"
          git push
